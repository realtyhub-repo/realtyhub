

spring:
  application:
    name: auth

  datasource:
    username: postgres
    password: root
    url: jdbc:postgresql://localhost:5432/auth_service

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
