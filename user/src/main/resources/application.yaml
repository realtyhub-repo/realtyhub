spring:
  application:
    name: user

  datasource:
    username: postgres
    password: root
    url: jdbc:postgresql://localhost:5432/user_service

  jpa:

    hibernate:
        ddl-auto: update

    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
    port: 8082